# Netlify sirve la carpeta public/ tal cual. No hay compilación:
# el robot deja los ficheros ya escritos en el repositorio.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
