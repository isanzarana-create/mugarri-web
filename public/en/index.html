:root { --paper: #FAFAF7; --ink: #0F0F0F; --graphite: #6B6B6B; --line: #E5E5E1; --brand: #C21838; --navy: #0D1B35; --font-sans: 'Inter', system-ui, -apple-system, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace; --gutter: clamp(1.5rem, 4vw, 3rem); --topbar-h: 3.5rem; }

*, ::before, ::after { box-sizing: border-box; margin: 0px; padding: 0px; }

h1, h2, h3 { font-size: inherit; font-weight: inherit; }

html, body { height: 100%; overflow: hidden; }

body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); font-size: 16px; -webkit-font-smoothing: antialiased; }

a { color: inherit; text-decoration: none; }

::selection { background: var(--ink); color: var(--paper); }

.topbar { position: fixed; top: 0px; left: 0px; right: 0px; z-index: 200; height: var(--topbar-h); display: flex; align-items: center; padding-inline: var(--gutter); background: rgba(250, 250, 247, 0.88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }

.topbar-inner { display: flex; justify-content: space-between; align-items: center; width: 100%; }

.topbar-right { display: flex; align-items: center; gap: 0.75rem; }

.wordmark { font-family: var(--font-mono); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; }

.wordmark sup { font-size: 0.55em; vertical-align: super; letter-spacing: 0px; }

.topbar-icons { display: flex; align-items: center; gap: 0.35rem; }

.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; color: var(--brand); border: 1px solid rgba(194, 24, 56, 0.3); border-radius: 50%; transition: color 0.2s, border-color 0.2s, opacity 0.2s; }

.icon-btn:hover { opacity: 0.72; border-color: var(--brand); }

.icon-btn svg { width: 13px; height: 13px; display: block; }

.nav-menu { position: relative; }

.nav-toggle { display: flex; flex-direction: column; gap: 4px; cursor: pointer; padding: 6px; background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--ink); }

.nav-toggle span { display: block; width: 18px; height: 1.5px; background: currentcolor; transition: 0.25s; }

.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }

.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }

.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

.nav-dropdown { display: none; position: absolute; top: calc(100% + 0.6rem); right: 0px; background: var(--paper); border: 1px solid var(--line); min-width: 282px; padding: 0.4rem 0px; z-index: 300; box-shadow: rgba(0, 0, 0, 0.08) 0px 8px 24px; }

.nav-dropdown.open { display: block; animation: 0.16s ease 0s 1 normal none running fadeSlide; }

@keyframes fadeSlide { 
  0% { opacity: 0; transform: translateY(-5px); }
  100% { opacity: 1; transform: none; }
}

.nav-dropdown a { white-space: nowrap; display: flex; align-items: center; gap: 0.9rem; padding: 0.65rem 1.2rem; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--graphite); transition: color 0.15s, background 0.15s; cursor: pointer; }

.nav-dropdown a:hover { color: var(--ink); background: rgba(0, 0, 0, 0.03); }

.nav-num { color: var(--brand); min-width: 22px; font-size: 0.65rem; }

.lang-btn { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--graphite); background: none; border: 1px solid var(--line); padding: 0.2rem 0.5rem; cursor: pointer; transition: color 0.2s, border-color 0.2s; }

.lang-btn:hover { color: var(--ink); border-color: var(--graphite); }

.hero { position: fixed; inset: 0px; width: 100vw; height: 100vh; background: var(--paper); overflow: hidden; z-index: 0; }

.hero-img { position: absolute; inset: 0px; width: 100%; height: 100%; object-fit: cover; object-position: center center; mix-blend-mode: multiply; }

.hero-caption { position: absolute; top: calc(var(--topbar-h) + clamp(3.5rem, 7vh, 6rem)); right: var(--gutter); font-family: var(--font-mono); color: var(--brand); max-width: 30ch; text-align: right; z-index: 1; }

.hero-caption-main { font-size: clamp(0.62rem, 0.85vw, 0.72rem); line-height: 2.15; letter-spacing: 0.03em; font-weight: 400; }

.panel-overlay { position: fixed; inset: 0px; z-index: 300; background: rgba(15, 15, 15, 0.35); opacity: 0; pointer-events: none; transition: opacity 0.3s; }

.panel-overlay.open { opacity: 1; pointer-events: all; }

.side-panel { position: fixed; top: 0px; right: 0px; bottom: 0px; z-index: 400; width: min(420px, 100vw); background: var(--paper); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); display: flex; flex-direction: column; overflow: hidden; }

.side-panel.open { transform: translateX(0px); }

.panel-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--line); flex-shrink: 0; margin-top: var(--topbar-h); }

.panel-title { font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 400; color: var(--ink); }

.panel-close { background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; font-family: var(--font-mono); font-size: 1.2rem; color: var(--graphite); line-height: 1; padding: 4px; transition: color 0.2s; }

.panel-close:hover { color: var(--ink); }

.panel-body { flex: 1 1 0%; overflow-y: auto; padding: 1.5rem 1.5rem 3rem; font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.85; color: var(--ink); }

.panel-body p + p { margin-top: 1.3rem; }

.accent { color: var(--brand); font-weight: 500; }

.service-lead { margin-top: 1.5rem !important; }

.panel-body a { border-bottom: 1px solid transparent; transition: border-color 0.2s; }

.panel-body a:hover { border-bottom-color: var(--ink); }

.musubigara-link { color: var(--brand); border-bottom: 1px solid !important; }

.musubigara-link:hover { opacity: 0.7; }

.service-cta { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 1rem; padding: 0.28rem 0.65rem; background: var(--navy); color: rgb(255, 255, 255); border: 1px solid var(--navy); border-radius: 999px; font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.08em; transition: opacity 0.2s; }

.service-cta:hover { opacity: 0.82; border-bottom-color: transparent !important; }

.contact-block { display: grid; gap: 0.6rem; margin-top: 0.5rem; }

.contact-item { display: flex; align-items: center; gap: 0.65rem; }

.ci-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; color: var(--brand); flex-shrink: 0; }

.ci-icon svg { width: 13px; height: 13px; display: block; }

.contact-item a { font-size: 0.68rem; }

.qr-float { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; text-decoration: none; }

.qr-code { width: 56px; height: 56px; display: block; }

.qr-code svg { width: 100%; height: 100%; display: block; }

@media (max-width: 640px) {

@media (max-width: 460px) {

        "text": "Mugarri is a Basque compound word: muga (boundary, border) and harri (stone). It literally means the stone that marks the boundary. For centuries these stones have marked the edges of municipalities, valleys, common woodland and grazing land across the Basque Country and Navarre, driven into mountain passes and ridgelines by people who knew the ground inch by inch. In Basque, mugarri also carries a figurative meaning: a milestone, a reference point that marks a before and an after."

        "text": "LARRE Long Distance is a 214 km non-stop, self-supported ultra-trail across the mountain ranges of Álava. It is organised by Musubigara®, the team behind Mugarri, which shows our real experience in running high-level sports events in the territory."
      }
    },
    {
      "@type": "Question",
      "name": "How can I book an experience with Mugarri?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The most direct way is to write to us at ignacio@musubigara.org. Tell us what you have in mind — gravel, trail running, an event, or simply exploring the Basque Country in a different way — and we will design it together from scratch."
      }
    }

<p><em>Mugarri</em> es una palabra compuesta del euskera: <em>muga</em> (límite, frontera) + <em>harri</em> (piedra). Literalmente, <span class="accent">la piedra que marca el límite</span>. Durante siglos el mugarri ha delimitado términos municipales, valles, montes comunales y pastos en el País Vasco y Navarra: piedras grabadas y clavadas en collados, cordales y encrucijadas por quienes conocían el terreno palmo a palmo. Muchas siguen ahí, y por delante de ellas pasan hoy nuestras rutas.</p>
<p>En euskera, <em>mugarri</em> tiene además un segundo sentido, figurado: un <strong>hito</strong>, un punto de referencia que marca un antes y un después.</p>
<p class="service-lead"><strong>¿Por qué se llama Mugarri este espacio?</strong></p>
<p>Porque trabajamos en las mugas. Nuestras rutas de gravel y trail cruzan los límites entre Álava, Navarra, Gipuzkoa y Bizkaia por los mismos collados y cordales donde todavía se encuentran esas piedras.</p>
<p>Porque un mugarri lo coloca quien conoce el terreno. No es una señal de catálogo: es una marca puesta a mano, en el sitio exacto, por gente de aquí. <span class="accent">Rutas que solo los de aquí saben trazar.</span></p>

            title: "Who we are",
            body: `<p>Mugarri is an artisan active-tourism project born from <a href="https://musubigara.org" target="_blank" rel="noopener" class="musubigara-link">Musubigara®</a>, a Basque cultural and sports management brand. Together with a network of allied companies, we design gravel and trail running experiences with the same care and attention to detail, whether crafting a route, producing an event or supporting clients on the ground.</p>
<p>We know the sector from both sides: we ride it — gravel bikes and trail shoes — and we manage it professionally, with over 30 years of combined experience. That dual perspective lets us understand what every accommodation, supplier, and rider actually needs. Each collaboration is <span class="accent">custom, tailored, mimo</span> — because no product is the same.</p>
<p>Among our projects, we organise endurance events such as <a href="https://larrelongdistance.org" target="_blank" rel="noopener" class="musubigara-link">LARRE Long Distance</a> — a 214 km self-supported ultra-trail through the mountains of Álava — giving our partners the real-world confidence of a team that knows how to run high-level events on the ground.</p>
<a class="service-cta" href="mailto:ignacio@musubigara.org">Get in touch by email →</a>`

          meaning: {
            num: "02",
            title: "What does Mugarri mean?",
            body: `<p class="service-lead"><strong>Mugarri — the stone that marks the boundary</strong></p>
<p><em>Mugarri</em> is a Basque compound word: <em>muga</em> (boundary, border) + <em>harri</em> (stone). Literally, <span class="accent">the stone that marks the boundary</span>. For centuries the mugarri has marked the edges of municipalities, valleys, common woodland and grazing land across the Basque Country and Navarre: carved stones driven into mountain passes, ridgelines and crossroads by people who knew the ground inch by inch. Many are still standing, and our routes run right past them.</p>
<p>In Basque, <em>mugarri</em> carries a second, figurative meaning: a <strong>milestone</strong> — a reference point that marks a before and an after.</p>
<p class="service-lead"><strong>Why is this place called Mugarri?</strong></p>
<p>Because we work on the boundaries. Our gravel and trail routes cross the borders between Álava, Navarre, Gipuzkoa and Bizkaia, over the same passes and ridgelines where those stones still stand.</p>
<p>Because a mugarri is placed by someone who knows the ground. It is not a catalogue signpost: it is a mark set by hand, in the exact spot, by local people. <span class="accent">Routes only locals know how to trace.</span></p>
<p>And because we want every experience to be a milestone, not a repeated product. Custom, tailored, con mimo. No two routes are the same.</p>
<a class="service-cta" href="https://wa.me/34620463558" target="_blank" rel="noopener">Talk to us →</a>`

    /* ── STATE ── */
    let lang = 'es';

    /* ── LANGUAGE SWITCH ── */
    function setLang(l) {
      lang = l;
      document.documentElement.lang = l;
      document.documentElement.dataset.lang = l;
      document.getElementById('page-title').textContent = t[l].title;
      document.querySelector('#page-desc').setAttribute('content', t[l].desc);
      document.querySelectorAll('[data-t]').forEach(el => {
        const k = el.dataset.t;
        if (t[l][k] !== undefined) el.innerHTML = t[l][k];
      });
      document.getElementById('lang-btn').textContent = l === 'es' ? 'EN' : 'ES';
    }

    document.getElementById('lang-btn').addEventListener('click', () => {
      const next = lang === 'es' ? 'en' : 'es';
      setLang(next);
      // Update canonical + og:url for crawlers
      const base = 'https://mugarri.org/';
      const url = location.origin + location.pathname;
      document.getElementById('canonical-link').setAttribute('href', url);
      const ogUrl = document.getElementById('og-url');
      if (ogUrl) ogUrl.setAttribute('content', url);
    });

    // Detect lang from URL on load
    if (window.location.pathname.startsWith('/en')) {
      setLang('en');
    }

    /* ── DROPDOWN ── */
    const navToggle = document.getElementById('nav-toggle');
    const navDropdown = document.getElementById('nav-dropdown');

    function openDropdown() {
      navDropdown.classList.add('open');
      navToggle.setAttribute('aria-expanded', 'true');
    }
    function closeDropdown() {
      navDropdown.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    }

    navToggle.addEventListener('click', e => {
      e.stopPropagation();
      navDropdown.classList.contains('open') ? closeDropdown() : openDropdown();
    });

    document.addEventListener('click', e => {
      if (!navToggle.contains(e.target) && !navDropdown.contains(e.target)) closeDropdown();
    });

    /* ── SIDE PANEL ── */
    const panel = document.getElementById('side-panel');
    const overlay = document.getElementById('panel-overlay');

    function openPanel(key) {
      const s = t[lang].sections[key];
      document.getElementById('panel-num').textContent = s.num;
      document.getElementById('panel-title').textContent = s.title;
      document.getElementById('panel-body').innerHTML = s.body;
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      overlay.classList.add('open');
      panel.dataset.currentSection = key;
    }

    function closePanel() {
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      overlay.classList.remove('open');
    }

    document.querySelectorAll('[data-section]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        closeDropdown();
        const key = a.dataset.section;
        // If same section is open, close it; else open new
        if (panel.classList.contains('open') && panel.dataset.currentSection === key) {
          closePanel();
        } else {
          openPanel(key);
        }
      });
    });

    document.getElementById('panel-close').addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closePanel(); closeDropdown(); }
    });
  </script>
